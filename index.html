<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESCÁNER DE ACCESO</title>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<style>
body{font-family:Arial,sans-serif;background:#111;color:#fff;margin:0;padding:18px}
.wrap{max-width:650px;margin:auto}.card{background:#1d1d1d;border-radius:16px;padding:18px;margin-bottom:15px}
input,button{width:100%;padding:13px;border-radius:9px;border:0;margin-top:8px;font-size:16px}
button{font-weight:bold;cursor:pointer}.ok{background:#0a7b28}.bad{background:#b00020}
#reader{background:#fff;border-radius:12px;overflow:hidden;margin-top:15px}
#result{font-size:22px;font-weight:800;text-align:center;padding:18px;border-radius:12px;background:#333}
.small{opacity:.8;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>ESCÁNER DE ACCESO</h1>
<p class="small">Cada teléfono debe tener un identificador distinto.</p>
<input id="device" placeholder="Ejemplo: CELULAR-01">
<button onclick="start()">INICIAR CÁMARA</button>
</div>
<div class="card"><div id="reader"></div><div id="result">ESPERANDO QR...</div></div>
</div>
<script src="config.js"></script>
<script>
let scanner=null,busy=false;
function setResult(text,ok){const e=document.getElementById('result');e.textContent=text;e.className=ok?'ok':'bad'}
function extract(text){
  const folio=(text.match(/X-REG-FOLIO[:=]([A-Za-z0-9_-]+)/)||text.match(/FOLIO=([A-Za-z0-9_-]+)/)||[])[1]||'';
  const sig=(text.match(/X-REG-SIG[:=]([A-Za-z0-9_-]+)/)||[])[1]||'';
  return {folio,sig};
}
async function start(){
  const id=document.getElementById('device').value.trim().toUpperCase();
  if(!id){alert('Escribe el ID del celular.');return}
  localStorage.setItem('scannerDevice',id);
  if(scanner)return;
  scanner=new Html5Qrcode('reader');
  try{
    await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:260}},onScan);
    setResult('CÁMARA ACTIVA — ESPERANDO QR...',true);
  }catch(e){setResult('NO SE PUDO ABRIR LA CÁMARA: '+e,false)}
}
function onScan(decoded){
  if(busy)return;
  const x=extract(decoded);
  if(!x.folio||!x.sig){setResult('QR NO RECONOCIDO',false);return}
  busy=true; setResult('VALIDANDO...',true);
  const cb='cb_'+Date.now();
  window[cb]=function(d){
    delete window[cb]; busy=false;
    if(d.ok){setResult('✓ '+d.message+' — '+d.nombre+' — '+(d.acceso||''),true)}
    else{setResult('✕ '+d.message,false)}
    setTimeout(()=>{if(document.getElementById('result'))document.getElementById('result').textContent='ESPERANDO QR...'},3500);
  };
  const url=APPS_SCRIPT_URL+'?action=scan&folio='+encodeURIComponent(x.folio)+'&sig='+encodeURIComponent(x.sig)+'&scannerId='+encodeURIComponent(localStorage.getItem('scannerDevice')||'SIN-ID')+'&callback='+cb+'&_='+Date.now();
  const s=document.createElement('script');s.src=url;s.onerror=function(){delete window[cb];busy=false;setResult('ERROR DE CONEXIÓN CON GOOGLE APPS SCRIPT',false)};document.body.appendChild(s);
}
document.getElementById('device').value=localStorage.getItem('scannerDevice')||'';
</script>
</body>
</html>
